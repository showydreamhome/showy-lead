<!DOCTYPE html>
<html>

<head>

<title>SHOWY Coverage Map</title>



<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
}

#map{
    height:calc(100vh - 60px);
    width:100%;
}

#locateBtn{

    position:fixed;

    right:20px;

    bottom:40px;

    width:65px;

    height:65px;

    border-radius:50%;

    border:none;

    background:white;

    font-size:30px;

    cursor:pointer;

    z-index:99999;

    box-shadow:0 4px 15px rgba(0,0,0,.25);

}

#mapTitle{

    position:absolute;

    top:75px;

    left:50%;

    transform:translateX(-50%);

    z-index:99999;

    background:black;

    color:gold;

    padding:12px 25px;

    border-radius:30px;

    font-size:18px;

    font-weight:bold;

    border:2px solid gold;

}

#legend{

position:absolute;

bottom:20px;

left:20px;

z-index:9999;

background:white;

padding:10px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.2);

display:flex;

gap:8px;

flex-wrap:wrap;

}

#legend button{

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

background:#f2f2f2;

}

#legend button.active{

background:#000;

color:#fff;

border:2px solid gold;

}

#legend span{

background:#f2f2f2;
padding:2px 8px;
border-radius:20px;
margin-left:5px;
font-size:12px;
font-weight:bold;
color:#000;

}

#legend button.active span{

background:gold;
color:#000;

}

@media(max-width:768px){

#legend{

left:10px;
right:10px;
bottom:10px;

display:grid;
grid-template-columns:1fr 1fr;
gap:6px;

}

#legend button{

font-size:13px;
padding:10px;

}

}

</style>

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">

</head>

<body>

<input
type="text"
id="searchBox"
placeholder="🔍 Search Client / Property"
style="
width:100%;
padding:15px;
font-size:16px;
border:none;
outline:none;
background:white;
">

<div id="legend">

<button
id="btnAll"
onclick="filterPins('all')">

All <span id="allCount">0</span>

</button>

<button
id="btnLead"
onclick="filterPins('lead')">

🔵 Leads <span id="leadCount">0</span>

</button>

<button
id="btnProject"
onclick="filterPins('project')">

🟠 Projects <span id="projectCount">0</span>

</button>

<button
id="btnBranding"
onclick="filterPins('branding')">

🔴 Branding <span id="brandingCount">0</span>

</button>

</div>

<div id="mapTitle">

🏠 SHOWY LEADS MAP

</div>

<div id="map"></div>

<button id="locateBtn">
🎯
</button>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbyhOBAiWgj8h-y4Z34GUeClyGM4mBxytaW8myyC8RUHC7M4Kv6r_cpwH83XcZaVagfQ/exec";

const map =
L.map('map');

let userMarker;
let userCircle;
let allMarkers = [];
const markers =
L.markerClusterGroup({

    disableClusteringAtZoom:16,

    spiderfyOnMaxZoom:true,

    showCoverageOnHover:false,

    zoomToBoundsOnClick:true

});

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

navigator.geolocation.getCurrentPosition(

function(pos){

    const lat =
    pos.coords.latitude;

    const lng =
    pos.coords.longitude;

    map.setView(
        [lat,lng],
        16
    );

});

navigator.geolocation.watchPosition(

function(pos){

    const lat =
    pos.coords.latitude;

    const lng =
    pos.coords.longitude;

    if(userMarker){

        map.removeLayer(userMarker);

    }

    if(userCircle){

        map.removeLayer(userCircle);

    }

    userCircle =
    L.circle(

        [lat,lng],

        {
            radius:25,
            color:"#4285F4",
            fillColor:"#4285F4",
            fillOpacity:0.15,
            weight:2
        }

    ).addTo(map);

    userMarker =
    L.circleMarker(

        [lat,lng],

        {
            radius:10,
            fillColor:"#4285F4",
            color:"#ffffff",
            weight:3,
            fillOpacity:1
        }

    ).addTo(map);

});

const blueIcon = new L.Icon({
iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34]
});

const orangeIcon = new L.Icon({
iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34]
});

const redIcon = new L.Icon({
iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
iconSize:[25,41],
iconAnchor:[12,41],
popupAnchor:[1,-34]
});

async function loadPins(){

    const response =
    await fetch(API);

    const data =
    await response.json();

     let leadCount = 0;
     let projectCount = 0;
      let brandingCount = 0;
 data.forEach(item=>{

    if(item.lat && item.lng){

        // Count records
        if(item.type === "lead"){
            leadCount++;
        }

        else if(item.type === "project"){
            projectCount++;
        }

        else if(item.type === "branding"){
            brandingCount++;
        }

        let marker;

document.getElementById("leadCount").innerHTML =
leadCount;

document.getElementById("projectCount").innerHTML =
projectCount;

document.getElementById("brandingCount").innerHTML =
brandingCount;

document.getElementById("allCount").innerHTML =
leadCount + projectCount + brandingCount;


if(item.type === "lead"){

    const lat =
 parseFloat(item.lat) +
 ((Math.random() - 0.5) * 0.00025);

 const lng =
 parseFloat(item.lng) +
 ((Math.random() - 0.5) * 0.00025);

 marker = L.marker(
 [lat,lng],
 {
 icon:blueIcon
 });

}

else if(item.type === "project"){

    marker = L.marker(
    [item.lat,item.lng],
    {icon:orangeIcon}
    );

}

else if(item.type === "branding"){

    const lat =
    parseFloat(item.lat) +
    ((Math.random() - 0.5) * 0.00025);

    const lng =
    parseFloat(item.lng) +
    ((Math.random() - 0.5) * 0.00025);

    marker = L.marker(
    [lat,lng],
    {icon:redIcon}
    );

}

let popup = "";

if(item.type === "lead"){

popup = `
<div style="width:250px">

<h3>🏠 Lead</h3>

<b>Property:</b> ${item.title || "-"}<br>
<b>Client:</b> ${item.clientName || "-"}<br>
<b>Covered By:</b> ${item.marketing1 || "-"}<br>
<b>Service:</b> ${item.service || "-"}<br>
<b>Remarks:</b> ${item.remarks || "-"}
`;

}

else if(item.type === "project"){

popup = `
<div style="width:250px">

<h3>🏗 Project</h3>

<b>Project:</b> ${item.title || "-"}<br>
<b>Builder:</b> ${item.builderName || "-"}<br>
<b>Type:</b> ${item.projectType || "-"}<br>
<b>Captured By:</b> ${item.capturedBy || "-"}<br>
<b>Remarks:</b> ${item.remarks || "-"}
`;

}

else if(item.type === "branding"){

popup = `
<div style="width:250px">

<h3>📢 Branding</h3>

<b>Location:</b> ${item.title || "-"}<br>
<b>Branding:</b> ${item.brandingType || "-"}<br>
<b>Visibility:</b> ${item.visibility || "-"}<br>
<b>Captured By:</b> ${item.capturedBy || "-"}<br>
<b>Remarks:</b> ${item.remarks || "-"}
`;

}

if(item.photoURL){

if(
item.whatsapp &&
item.whatsapp !== "-" &&
item.whatsapp !== "*" &&
item.whatsapp !== "#ERROR!"
){

popup += `
<br><br>

<a
href="https://wa.me/91${String(item.whatsapp).replace(/\D/g,'')}"
target="_blank"
style="
display:block;
background:#25D366;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-bottom:10px;
">

💬 WhatsApp

</a>
`;

}

popup += `
<br><br>
<img
src="${item.photoURL}"
style="
width:100%;
border-radius:10px;
">
`;
}

popup += `

<br><br>

<a
href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}"
target="_blank"
style="
display:block;
background:#48B3F0;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:10px;
">



Get Directions

</a>

</div>
`;

markers.addLayer(marker);

marker.bindPopup(popup);

marker.on('click', function(){

    map.panTo(
        marker.getLatLng()
    );

});

marker.searchText =
(
(item.clientName || "") +
" " +
(item.title || "")
).toLowerCase();

marker.markerType = 
item.type;

allMarkers.push(marker);

        }

    });

}

loadPins();

map.addLayer(markers);

document
.getElementById('btnAll')
.classList.add('active');

setTimeout(() => {

    if(markers.getLayers().length > 0){

        map.fitBounds(
            markers.getBounds(),
            {padding:[50,50]}
        );

    }

},1000);

document

.getElementById("searchBox")

.addEventListener(

"keyup",

function(){

    const search =

    this.value.toLowerCase();

    allMarkers.forEach(marker=>{

        if(

            marker.searchText

            .includes(search)

        ){

            if(!markers.hasLayer(marker)){
            markers.addLayer(marker);
            }

        }

        else{

            markers.removeLayer(marker);

        }

    });

});

document
.getElementById("locateBtn")
.addEventListener(
"click",
function(){

    navigator.geolocation.getCurrentPosition(

    function(pos){

        const lat =
        pos.coords.latitude;

        const lng =
        pos.coords.longitude;

        map.flyTo(
            [lat,lng],
            18,
            {
                animate:true,
                duration:1.5
            }
        );

    },

    function(error){

        alert(
        "Location Permission Required"
        );

    }

    );

});


function filterPins(type){

document
.querySelectorAll('#legend button')
.forEach(btn=>btn.classList.remove('active'));

if(type === "all")
document.getElementById('btnAll')
.classList.add('active');

if(type === "lead")
document.getElementById('btnLead')
.classList.add('active');

if(type === "project")
document.getElementById('btnProject')
.classList.add('active');

if(type === "branding")
document.getElementById('btnBranding')
.classList.add('active');

markers.clearLayers();

allMarkers.forEach(marker=>{

if(
type === "all" ||
marker.markerType === type
){

markers.addLayer(marker);

}

});

}

</script>

</body>

</html>
