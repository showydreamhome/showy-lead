<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOWY PROJECT CAPTURE</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:750px;
margin:auto;
background:#080808;
padding:30px;
border-radius:30px;
border:1px solid #222;
box-shadow:0 0 25px rgba(255,215,0,.1);
}

.back-btn{

width:auto !important;
background:black !important;
color:gold !important;

border:1px solid gold !important;
border-radius:50px !important;

padding:10px 15px !important;
font-size:14px !important;

margin-bottom:25px;
cursor:pointer;
}

h1{
text-align:center;
color:gold;
font-size:42px;
margin-bottom:30px;
}

.section-title{
color:gold;
font-size:24px;
margin-bottom:15px;
margin-top:25px;
font-weight:bold;
}

.input-box{
width:100%;
padding:18px;
background:#141414;
border:none;
border-radius:16px;
color:white;
font-size:18px;
margin-bottom:20px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:18px;
background:gold;
border:none;
border-radius:16px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.file-box{
background:#141414;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}

#map{
height:300px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.loader{
border:5px solid #222;
border-top:5px solid gold;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

#loadingBox{
display:none;
text-align:center;
margin-top:20px;
}

#loadingText{
color:gold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<button
class="back-btn"
onclick="window.location.href='index.html'">

← Back

</button>

<h1>🏗 PROJECT CAPTURE</h1>

<div class="section-title">
🏗 Project Details
</div>

<input
type="text"
id="projectName"
placeholder="Project Name"
class="input-box">

<select
id="projectType"
class="input-box">

<option value="">
Select Project Type
</option>

<option>Apartment</option>
<option>Villa</option>
<option>Plots</option>
<option>Commercial</option>
<option>Office</option>

</select>

<select
id="projectStage"
class="input-box">

<option value="">
Project Stage
</option>

<option>Planning</option>
<option>Excavation</option>
<option>Foundation</option>
<option>Structure</option>
<option>Finishing</option>
<option>Completed</option>

</select>

<input
type="text"
id="builderName"
placeholder="Builder Name"
class="input-box">

<input
type="number"
id="units"
placeholder="Number of Units"
class="input-box">

<textarea
id="address"
placeholder="Address"
class="input-box"></textarea>

<div class="section-title">
👤 Captured By
</div>

<select
id="capturedBy"
class="input-box">

<option value="">
Select Team Member
</option>

<option>Hari</option>
<option>Ajay</option>
<option>Thejas</option>
<option>Chandan</option>
<option>Kiran</option>
<option>Krishna Murty</option>
<option>Naidu</option>

</select>

<div class="section-title">
📸 Project Photo
</div>

<div class="file-box">

<input
type="file"
id="photo"
class="input-box">

</div>

<button onclick="detectLocation()">

📍 Detect Location

</button>

<div id="map"></div>

<div class="section-title">
📝 Remarks
</div>

<textarea
id="remarks"
placeholder="Enter Remarks"
class="input-box"></textarea>

<br>

<button
onclick="submitProject()">

🚀 Submit Project

</button>

<div id="loadingBox">

<div class="loader"></div>

<p id="loadingText">

Uploading...

</p>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

window.onerror = function(msg,url,line){

alert(
"ERROR: " +
msg +
" Line: " +
line
);

console.log(msg,url,line);

};

const API =
"https://script.google.com/macros/s/AKfycbyhOBAiWgj8h-y4Z34GUeClyGM4mBxytaW8myyC8RUHC7M4Kv6r_cpwH83XcZaVagfQ/exec";

let map;
let marker;

let lat="";
let lng="";

function generateProjectID(){

return "PRJ-" +
Math.floor(
1000 + Math.random()*9000
);

}

function detectLocation(){

navigator.geolocation.getCurrentPosition(

async (pos)=>{

lat = pos.coords.latitude;
lng = pos.coords.longitude;

if(!map){

map = L.map('map')
.setView([lat,lng],16);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

marker = L.marker([lat,lng])
.addTo(map);

}else{

marker.setLatLng([lat,lng]);

map.setView([lat,lng],16);

}

const response = await fetch(
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
);

const data = await response.json();

document.getElementById("address").value =
data.display_name || "";

},

(err)=>{

alert(
"Location Error: " +
err.message
);

}

);

}

async function submitProject(){

document
.getElementById("loadingBox")
.style.display="block";

let photoURL="";

const file =
document
.getElementById("photo")
.files[0];

if(file){

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
"showycrm"
);

const upload =
await fetch(

"https://api.cloudinary.com/v1_1/dm93fbznl/image/upload",

{
method:"POST",
body:formData
}

);

const result =
await upload.json();

photoURL =
result.secure_url;

}

await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"saveProject",

projectID:
generateProjectID(),

projectName:
document.getElementById("projectName").value,

projectType:
document.getElementById("projectType").value,

projectStage:
document.getElementById("projectStage").value,

builderName:
document.getElementById("builderName").value,

units:
document.getElementById("units").value,

address:
document.getElementById("address").value,

remarks:
document.getElementById("remarks").value,

capturedBy:
document.getElementById("capturedBy").value,

photoURL:
photoURL,

lat:lat,

lng:lng

})

});

alert(
"✅ Project Saved"
);

location.reload();

}

</script>

</body>
</html>
