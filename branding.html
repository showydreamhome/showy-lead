<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOWY BRANDING</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:750px;
margin:auto;
background:#080808;
padding:30px;
border-radius:30px;
border:1px solid #222;
box-shadow:0 0 25px rgba(255,0,0,.15);
}

.back-btn{
width:auto !important;
background:black !important;
color:gold !important;
border:1px solid gold !important;
border-radius:50px !important;
padding:10px 15px !important;
font-size:14px !important;
margin-bottom:25px;
cursor:pointer;
}

h1{
text-align:center;
color:gold;
font-size:42px;
margin-bottom:30px;
}

.section-title{
color:gold;
font-size:24px;
margin-top:25px;
margin-bottom:15px;
font-weight:bold;
}

.input-box{
width:100%;
padding:18px;
background:#141414;
border:none;
border-radius:16px;
color:white;
font-size:18px;
margin-bottom:20px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:18px;
background:gold;
color:black;
border:none;
border-radius:16px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.file-box{
background:#141414;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}

#map{
height:300px;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.loader{
border:5px solid #222;
border-top:5px solid gold;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

#loadingBox{
display:none;
text-align:center;
margin-top:20px;
}

#loadingText{
color:gold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<button
class="back-btn"
onclick="window.location.href='index.html'">

← Back

</button>

<h1>📢 BRANDING PLAN</h1>

<div class="section-title">

📍 Branding Location

</div>

<input
type="text"
id="locationName"
placeholder="Location Name"
class="input-box">

<select
id="brandingType"
class="input-box">

<option value="">
Select Branding Type
</option>

<option>Hoarding</option>
<option>Billboard</option>
<option>Pole Kiosk</option>
<option>Bus Shelter</option>
<option>Wall Painting</option>
<option>Metro Branding</option>
<option>Apartment Gate Branding</option>
<option>Construction Fence Branding</option>
<option>LED Screen</option>

</select>

<select
id="visibility"
class="input-box">

<option value="">
Visibility Level
</option>

<option>High</option>
<option>Medium</option>
<option>Low</option>

</select>

<textarea
id="address"
placeholder="Address"
class="input-box"></textarea>

<div class="section-title">

👤 Captured By

</div>

<select
id="capturedBy"
class="input-box">

<option value="">
Select Team Member
</option>

<option>Hari</option>
<option>Ajay</option>
<option>Thejas</option>
<option>Chandan</option>
<option>Kiran</option>
<option>Krishna Murty</option>
<option>Naidu</option>
<option>Eshwar</option>
<option>Shivananda</option>
<option>Sangamesh</option>
<option>Nityanand</option>
<option>Devendrapaa</option>

</select>

<div class="section-title">

📸 Branding Photo

</div>

<div class="file-box">

<input
type="file"
id="photo"
class="input-box">

</div>

<button onclick="detectLocation()">

📍 Detect Location

</button>

<div id="map"></div>

<div class="section-title">

📝 Branding Requirement

</div>

<textarea
id="remarks"
placeholder="Example: 40ft x 20ft Hoarding, Main Road Facing, Heavy Traffic Area"
class="input-box"></textarea>

<br>

<button onclick="submitBranding()">

🚀 Submit Branding Location

</button>

<div id="loadingBox">

<div class="loader"></div>

<p id="loadingText">

Uploading...

</p>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbyhOBAiWgj8h-y4Z34GUeClyGM4mBxytaW8myyC8RUHC7M4Kv6r_cpwH83XcZaVagfQ/exec";

let map;
let marker;

let lat="";
let lng="";

function generateBrandingID(){

return "BRD-" +
Math.floor(
1000 + Math.random()*9000
);

}

function detectLocation(){

navigator.geolocation.getCurrentPosition(

async(pos)=>{

lat =
pos.coords.latitude;

lng =
pos.coords.longitude;

if(!map){

map =
L.map('map')
.setView([lat,lng],16);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

marker =
L.marker([lat,lng])
.addTo(map);

}else{

marker.setLatLng(
[lat,lng]
);

}

const response =
await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`

);

const data =
await response.json();

document
.getElementById("address")
.value =
data.display_name;

}

);

}

async function submitBranding(){

document
.getElementById("loadingBox")
.style.display="block";

let photoURL="";

const file =
document
.getElementById("photo")
.files[0];

if(file){

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
"showycrm"
);

const upload =
await fetch(

"https://api.cloudinary.com/v1_1/dm93fbznl/image/upload",

{
method:"POST",
body:formData
}

);

const result =
await upload.json();

photoURL =
result.secure_url;

}

await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"saveBranding",

brandingID:
generateBrandingID(),

locationName:
document.getElementById("locationName").value,

brandingType:
document.getElementById("brandingType").value,

visibility:
document.getElementById("visibility").value,

address:
document.getElementById("address").value,

remarks:
document.getElementById("remarks").value,

capturedBy:
document.getElementById("capturedBy").value,

photoURL:
photoURL,

lat:lat,

lng:lng

})

});

alert(
"✅ Branding Location Saved"
);

location.reload();

}

</script>

</body>
</html>
